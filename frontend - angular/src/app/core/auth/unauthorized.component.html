<div class="min-h-screen bg-background flex flex-col items-center justify-center relative overflow-hidden font-inter p-6">
<!-- Background Elements -->
<div class="absolute inset-0 z-0 opacity-10 pointer-events-none">
    <div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-error blur-[140px]"></div>
</div>

<!-- Header branding -->
<div class="absolute top-6 left-8 flex items-center gap-3 z-10">
    <span class="material-symbols-outlined text-primary text-[28px]">account_tree</span>
    <span class="text-on-surface font-black tracking-tight text-xl">BPM Suite</span>
</div>

<!-- Main Content -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-2xl p-10 max-w-lg w-full text-center shadow-xl z-10">
    <div class="w-20 h-20 mx-auto bg-error/10 border border-error/20 rounded-full flex items-center justify-center text-error mb-6">
        <span class="material-symbols-outlined text-[40px]">gpp_bad</span>
    </div>
    
    <h1 class="text-headline-md font-bold text-on-surface mb-3">Acceso Denegado</h1>
    
    <p class="text-body-base text-on-surface-variant mb-8">
        No cuenta con los privilegios necesarios para acceder a este módulo corporativo o su sesión ha expirado. Por favor, inicie sesión con una cuenta autorizada.
    </p>
    
    <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
        <button (click)="goToLogin()" class="w-full sm:w-auto px-6 py-3 bg-primary text-on-primary rounded-lg font-semibold text-sm hover:bg-primary-container hover:text-primary-container-on transition-colors flex items-center justify-center gap-2 shadow-sm">
            <span class="material-symbols-outlined text-[18px]">login</span>
            Volver a Iniciar Sesión
        </button>
        <button class="w-full sm:w-auto px-6 py-3 bg-surface border border-outline-variant text-on-surface-variant hover:bg-surface-container hover:text-on-surface rounded-lg font-semibold text-sm transition-colors">
            Contactar Soporte
        </button>
    </div>
</div>

<div class="absolute bottom-6 text-center z-10">
    <p class="text-[11px] text-on-surface-variant font-code-mono opacity-60">INCIDENT-ID: {{ incidentId }}</p>
</div>
</div>
