server:
  port: 8081
 
spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
 
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
 
  flyway:
    clean-disabled: false
    clean-on-validation-error: true
 
logging:
  level:
    com.example.smartworkflow: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: DEBUG
    org.springframework.web.cors: DEBUG