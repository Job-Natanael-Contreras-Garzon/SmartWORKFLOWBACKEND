server:
  port: 8080

spring:
  application:
    name: smartworkflow
 
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2
 
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
 
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: false
    url: ${DB_URL}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
 
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8
 
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}
 
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
 
app:
  mail:
    from: ${MAIL_FROM:SmartWorkflow <noreply@smartworkflow.app>}
    base-url: ${APP_BASE_URL:http://localhost:4200}
    org-name: ${APP_ORG_NAME:SmartWorkflow}
 
logging:
  level:
    root: INFO